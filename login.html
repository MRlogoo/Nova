
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | NOVA</title>
  <link rel="stylesheet" href="cstyle.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <a class="logo" href="index.html">NOVA</a>
    <form class="auth-card" data-demo-form>
      <h1>خوش برگشتی!</h1>
      <p>برای ورود به حساب کاربری اطلاعاتت را وارد کن.</p>
      <label for="email">ایمیل</label>
      <input id="email" type="email" placeholder="name@example.com" required>
      <label for="password">رمز عبور</label>
      <input id="password" type="password" placeholder="رمز عبور" required minlength="6">
      <button class="btn full" type="submit">ورود به حساب</button>
      <p class="form-message" aria-live="polite"></p>
      <p class="auth-switch">حساب نداری؟ <a href="register.html">ثبت‌نام کن</a></p>
      <a class="text-link" href="index.html">بازگشت به خانه</a>
    </form>
  </main>
</body>
</html>
