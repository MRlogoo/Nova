
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام | NOVA</title>
  <link rel="stylesheet" href="cstyle.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <a class="logo" href="index.html">NOVA</a>
    <form class="auth-card" data-demo-form>
      <h1>ساخت حساب NOVA</h1>
      <p>به جمع یادگیرندگان NOVA بپیوند.</p>
      <label for="name">نام و نام خانوادگی</label>
      <input id="name" type="text" placeholder="نام شما" required>
      <label for="email">ایمیل</label>
      <input id="email" type="email" placeholder="name@example.com" required>
      <label for="password">رمز عبور</label>
      <input id="password" type="password" placeholder="حداقل ۶ کاراکتر" required minlength="6">
      <label for="confirmPassword">تکرار رمز عبور</label>
      <input id="confirmPassword" type="password" placeholder="تکرار رمز عبور" required minlength="6">
      <button class="btn full" type="submit">ایجاد حساب</button>
      <p class="form-message" aria-live="polite"></p>
      <p class="auth-switch">قبلاً ثبت‌نام کرده‌ای؟ <a href="login.html">وارد شو</a></p>
      <a class="text-link" href="index.html">بازگشت به خانه</a>
    </form>
  </main>
</body>
</html>
